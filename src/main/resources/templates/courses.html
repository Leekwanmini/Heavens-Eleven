<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .courses-container {
            max-width: 1100px;
            margin: 60px auto;
        }
        .page-title {
            font-size: 2.8rem;
            font-weight: 700;
            color: #12355B;
        }
        .page-subtitle {
            font-size: 1.25rem;
            color: #6c757d;
        }
        .courses-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }
        .add-button {
            font-size: 1.1rem;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 600;
        }
        .table {
            margin-bottom: 0;
        }
        .table thead th {
            background-color: #12355B;
            color: white;
            padding: 15px;
        }
        .table tbody td {
            padding: 15px;
            vertical-align: middle;
        }
        .credits-badge {
            font-size: 1rem;
            padding: 8px 12px;
        }
    </style>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container courses-container">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h1 class="page-title">Courses</h1>
            <p class="page-subtitle">Your registered courses</p>
        </div>
        <a th:href="@{/courses/new}" class="btn btn-primary add-button">+ Add Course</a>
    </div>
    <div class="courses-card">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Course Name</th>
                    <th>Room No</th>
                    <th>Credits</th>
                    <th>Semester</th>
                    <th class="text-center">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="course : ${courses}">
                    <td><strong th:text="${course.courseName}">CPAN-228</strong></td>
                    <td th:text="${course.roomNo}">N213</td>
                    <td><span class="badge bg-primary credits-badge" th:text="${course.credits}">3</span>
                    </td>
                    <td th:text="${course.semester}">FALL</td>
                    <td class="text-center">
                        <a href="#" class="btn btn-outline-primary btn-sm">View Details</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(courses)}">
                    <td colspan="5" class="text-center text-muted py-4">No courses registered yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
