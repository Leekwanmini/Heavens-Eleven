<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .courses-container {
            max-width: 1100px;
            margin: 60px auto;
        }
        .page-title {
            font-size: 2.8rem;
            font-weight: 700;
            color: #12355B;
        }
        .page-subtitle {
            font-size: 1.25rem;
            color: #6c757d;
        }
        .courses-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }
        .add-button {
            font-size: 1.1rem;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 600;
        }
        .table {
            margin-bottom: 0;
        }
        .table thead th {
            background-color: #12355B;
            color: white;
            padding: 15px;
        }
        .table tbody td {
            padding: 15px;
            vertical-align: middle;
        }
        .credits-badge {
            font-size: 1rem;
            padding: 8px 12px;
        }
    </style>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container courses-container">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h1 class="page-title">Courses</h1>
            <p class="page-subtitle">All available courses</p>
        </div>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/courses/new}" class="btn btn-primary add-button">+ Add Course</a>
    </div>
    <!-- form added to search-->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <form th:action="@{/courses}" method="get" class="d-flex gap-2 flex-grow-1" style="max-width: 500px;">
            <input type="text" name="search" th:value="${search}" class="form-control" placeholder="Search course">
            <button type="submit" class="btn" style="background-color: #12355B; color: white;">Search</button>
        </form>

        <!-- added to sort. used boostrap icon --> 
        <div class="d-flex align-items-center gap-3">
            <span class="fw-bold text-muted">Sort by:</span>
            <a th:href="@{/courses(sort='credits', direction=${sort == 'credits' && direction == 'ASC' ? 'DESC' : 'ASC'}, search=${search})}"
            class="text-decoration-none fw-semibold" style="color: #0d6efd;">
                Credits
                <i th:if="${sort == 'credits' && direction == 'ASC'}" class="bi bi-caret-up-fill"></i>
                <i th:if="${sort == 'credits' && direction == 'DESC'}" class="bi bi-caret-down-fill"></i>
                <i th:unless="${sort == 'credits'}" class="bi bi-caret-up text-muted"></i>
            </a>
            <a th:href="@{/courses(sort='semester', direction=${sort == 'semester' && direction == 'ASC' ? 'DESC' : 'ASC'}, search=${search})}"
            class="text-decoration-none fw-semibold" style="color: #0d6efd;">
                Semester
                <i th:if="${sort == 'semester' && direction == 'ASC'}" class="bi bi-caret-up-fill"></i>
                <i th:if="${sort == 'semester' && direction == 'DESC'}" class="bi bi-caret-down-fill"></i>
                <i th:unless="${sort == 'semester'}" class="bi bi-caret-up text-muted"></i>
            </a>
        </div>
    </div>

    <div class="courses-card">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Course Name</th>
                    <th>Room No</th>
                    <th>Credits</th>
                    <th>Semester</th>
                    <th class="text-center">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="course : ${courses}">
                    <td><strong th:text="${course.courseName}">CPAN-228</strong></td>
                    <td th:text="${course.roomNo}">N213</td>
                    <td><span class="badge bg-primary credits-badge" th:text="${course.credits}">3</span></td>
                    <td th:text="${course.semester}">FALL</td>
                    
                    <td class="text-center">
                        <a href="#" class="btn btn-outline-primary btn-sm">View Details</a>
                        <a sec:authorize="hasRole('ADMIN')"
                        th:href="@{/courses/{id}/edit(id=${course.id})}"
                        class="btn btn-outline-secondary btn-sm">Edit</a>
                        <form sec:authorize="hasRole('ADMIN')"
                            th:action="@{/courses/{id}/delete(id=${course.id})}"
                            method="post" style="display:inline">
                            <button type="submit" class="btn btn-outline-danger btn-sm"
                                    onclick="return confirm('Delete this course?');">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(courses)}">
                    <td colspan="5" class="text-center text-muted py-4">No courses currently offered.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <!-- Pagination Controls -->
    <div th:if="${totalPages > 0}" class="d-flex flex-column flex-sm-row justify-content-between align-items-center mt-2 mb-5 gap-3">
        <!-- Display Paging Info -->
        <div class="text-muted small">
            Page <span class="fw-bold" th:text="${currentPage + 1}">1</span> of
            <span class="fw-bold" th:text="${totalPages}">1</span>
            (<span th:text="${totalElements}">0</span> Total Courses)
        </div>

        <!-- Navigation Buttons -->
        <nav aria-label="Team pagination">
            <ul class="pagination pagination-sm mb-0">
                <!-- First Page -->
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/courses(page=0, size=${pageSize}, sort=${sort}, direction=${direction}, search=${search}, filterType=${filterType})}">First</a>
                </li>

                <!-- Previous Page -->
                <li class="page-item" th:classappend="${!hasPrevious} ? 'disabled'">
                    <a class="page-link" th:href="@{/courses(page=${currentPage - 1}, size=${pageSize}, sort=${sort}, direction=${direction}, search=${search}, filterType=${filterType})}">Previous</a>
                </li>

                <!-- Page Numbers -->
                <th:block th:if="${totalPages > 0}">
                    <li class="page-item" th:each="p : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${p == currentPage} ? 'active'"
                        th:if="${p >= currentPage - 2 && p <= currentPage + 2}">
                        <a class="page-link" th:href="@{/courses(page=${p}, size=${pageSize}, sort=${sort}, direction=${direction}, search=${search}, filterType=${filterType})}" th:text="${p + 1}">1</a>
                    </li>
                </th:block>

                <!-- Next Page -->
                <li class="page-item" th:classappend="${!hasNext} ? 'disabled'">
                    <a class="page-link" th:href="@{/courses(page=${currentPage + 1}, size=${pageSize}, sort=${sort}, direction=${direction}, search=${search}, filterType=${filterType})}">Next</a>
                </li>

                <!-- Last Page -->
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/courses(page=${totalPages - 1}, size=${pageSize}, sort=${sort}, direction=${direction}, search=${search}, filterType=${filterType})}">Last</a>
                </li>
            </ul>
        </nav>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
