<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero {
            position: relative;
        }
        .hero-image {
            width: 100%;
            height: 450px;
            object-fit: cover;
        }
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
        }
        .hero-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            z-index: 1;
            text-shadow: 2px 2px 5px black;
        }
        .home-description {
            font-size: 1.5rem;
            line-height: 1.8;
            font-weight: 400;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            color: #333;
        }
        .course-button {
            font-size: 1.4rem;
            padding: 15px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .course-button:hover {
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="hero">
    <img th:src="@{/images/classroom.jpg}"
         alt="Classroom"
         class="hero-image">
    <div class="hero-overlay"></div>
    <div class="hero-text text-center">
        <h1 class="display-3 fw-bold">
            Welcome Student!
        </h1>
        <p class="fs-4">
            Course Manager Portal
        </p>
    </div>
</div>
<div class="container text-center mt-5">
    <h3 class="home-description mb-5">
        You can use this resource to find relevant details about your 
        presently registered courses, manage your profile, and add new courses 
        whenever needed. Get started by exploring your courses below!
    </h3>
    <a th:href="@{/courses}" class="btn btn-primary btn-lg course-button">
        Show Me Available Courses
    </a>
    <a th:href="@{/my-courses}" sec:authorize="hasRole('STUDENT')" class="btn btn-primary btn-lg course-button">
        Show Me My Courses
    </a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
