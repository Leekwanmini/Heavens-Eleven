<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <meta charset="UTF-8">
        <title>My Courses</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body { background-color: #f8f9fa; }
            .courses-container { max-width: 1100px; margin: 60px auto; }
            .page-title { font-size: 2.8rem; font-weight: 700; color: #12355B; }
            .courses-card { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.15); }
            .table thead th { background-color: #12355B; color: white; padding: 15px; }
            .table tbody td { padding: 15px; vertical-align: middle; }
            .credits-badge { font-size: 1rem; padding: 8px 12px; }
        </style>
    </head>
    <body>
        <nav th:replace="~{fragments/navbar :: navbar}"></nav>
        <div class="container courses-container">
            <h1 class="page-title mb-5">My Courses</h1>

            <div class="courses-card">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>Course Name</th>
                            <th>Room No</th>
                            <th>Credits</th>
                            <th>Semester</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="course : ${courses}">
                            <td><strong th:text="${course.courseName}">CPAN-228</strong></td>
                            <td th:text="${course.roomNo}">N213</td>
                            <td><span class="badge bg-primary credits-badge" th:text="${course.credits}">3</span></td>
                            <td th:text="${course.semester}">FALL</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(courses)}">
                            <td colspan="4" class="text-center text-muted py-4">You are not registered for any courses yet.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
