<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Assign Course</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body { background-color: #f8f9fa; }
            .assign-card {
                max-width: 700px;
                margin: 60px auto;
                padding: 40px;
                background: white;
                border-radius: 15px;
                box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            }
            .page-title {
                font-size: 2.5rem;
                font-weight: 700;
                text-align: center;
                margin-bottom: 35px;
                color: #12355B;
            }
            .form-label { font-weight: 600; font-size: 1.1rem; }
            .form-select { padding: 12px; font-size: 1.05rem; border-radius: 8px; }
            .submit-button {
                width: 100%;
                padding: 14px;
                font-size: 1.2rem;
                font-weight: 600;
                border-radius: 10px;
                margin-top: 15px;
            }
        </style>
    </head>
    <body>
        <nav th:replace="~{fragments/navbar :: navbar}"></nav>
        <div class="assign-card">
            <h2 class="page-title">Assign Course</h2>

            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

            <form th:action="@{/assign}" method="post">
                <div class="mb-4">
                    <label class="form-label">Student</label>
                    <select name="studentId" class="form-select" required>
                        <option th:each="student : ${students}"
                                th:value="${student.id}"
                                th:text="${student.username}"></option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">Course</label>
                    <select name="courseId" class="form-select" required>
                        <option th:each="course : ${courses}"
                                th:value="${course.id}"
                                th:text="${course.courseName}"></option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary submit-button">Assign Course</button>
            </form>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
