<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Add Course</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body {
                background-color: #f8f9fa;
            }
            .course-card {
                max-width: 700px;
                margin: 60px auto;
                padding: 40px;
                background: white;
                border-radius: 15px;
                box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            }
            .page-title {
                font-size: 2.5rem;
                font-weight: 700;
                text-align: center;
                margin-bottom: 35px;
                color: #12355B;
            }
            .form-label {
                font-weight: 600;
                font-size: 1.1rem;
            }
            .form-control,
            .form-select {
                padding: 12px;
                font-size: 1.05rem;
                border-radius: 8px;
            }
            .submit-button {
                width: 100%;
                padding: 14px;
                font-size: 1.2rem;
                font-weight: 600;
                border-radius: 10px;
                margin-top: 15px;
            }
        </style>
    </head>
    <body>
        <nav th:replace="~{fragments/navbar :: navbar}"></nav>
        <div class="course-card">
            <h2 class="page-title" th:text="${course.id} != null ? 
                'Edit Course' : 'Add New Course'">Add New Course</h2>
            <form th:action="${course.id} != null ? @{'/courses/' + ${course.id} + '/edit'} : @{/courses}"
                th:object="${course}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">
                <div class="mb-4">
                    <label class="form-label">Room No</label>
                    
                    <input type="text"
                        class="form-control"
                        th:field="*{roomNo}"
                        placeholder="e.g. N213"
                        th:classappend="${#fields.hasErrors('roomNo')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback"
                        th:if="${#fields.hasErrors('roomNo')}"
                        th:errors="*{roomNo}">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Credits</label>
                    <input type="number"
                        class="form-control"
                        th:field="*{credits}"
                        min="0"
                        max="3"
                        step="1">
                    <div class="invalid-feedback"
                        th:if="${#fields.hasErrors('credits')}"
                        th:errors="*{credits}">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Semester</label>
                    <select class="form-select"
                            th:field="*{semester}"
                            th:classappend="${#fields.hasErrors('semester')} ? 'is-invalid' : ''">
                        <option th:each="sem : ${T(com.heavenseleven.heavens_eleven.model.Semester).values()}"
                                th:value="${sem}"
                                th:text="${sem}">
                        </option>
                    </select>
                    <div class="invalid-feedback"
                        th:if="${#fields.hasErrors('semester')}"
                        th:errors="*{semester}">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Course Name</label>
                    <input type="text"
                        class="form-control"
                        th:field="*{courseName}"
                        placeholder="e.g. CPAN-228"
                        th:classappend="${#fields.hasErrors('courseName')} ? 'is-invalid' : ''">

                    <div class="invalid-feedback"
                        th:if="${#fields.hasErrors('courseName')}"
                        th:errors="*{courseName}">
                    </div>
                </div>
            <button type="submit" class="btn btn-primary submit-button" th:text="${course.id} != null ? 
            'Edit Course' : 'Add Course'">Add Course</button>
            </form>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
