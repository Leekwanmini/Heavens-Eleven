<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
    <meta charset="UTF-8">
    <title>Add Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container mt-4">
            <h2>Add Course</h2>
            <form th:action="@{/courses}" th:object="${course}" method="post" novalidate>

            <div class="mb-3">
                <label class="form-label">Room No</label>
                <input type="text" class="form-control" th:field="*{roomNo}"
                placeholder="e.g. N213"
                th:classappend="${#fields.hasErrors('roomNo')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('roomNo')}" th:errors="*{roomNo}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Credits</label>
                <input type="number" class="form-control" th:field="*{credits}"
                min="0" max="3" step="1"
                th:classappend="${#fields.hasErrors('credits')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('credits')}" th:errors="*{credits}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Semester</label>
                <select class="form-select" th:field="*{semester}"
                th:classappend="${#fields.hasErrors('semester')} ? 'is-invalid' : ''">
                <option th:each="sem : ${T(com.heavenseleven.heavens_eleven.model.Semester).values()}"
                th:value="${sem}" th:text="${sem}"></option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('semester')}" th:errors="*{semester}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Course Name</label>
                <input type="text" class="form-control" th:field="*{courseName}"
                placeholder="e.g. CPAN-228"
                th:classappend="${#fields.hasErrors('courseName')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('courseName')}" th:errors="*{courseName}"></div>
            </div>



            <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </body>
</html>
